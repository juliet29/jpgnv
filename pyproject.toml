[project]
name = "jpgnv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "Juliet Nwagwu Ume-Ezeoke", email = "jnwagwu@stanford.edu" },
]
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.11.0",
    "plyze>=0.1.9",
]

[build-system]
